name: Build APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Cài SDK Android
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "error:|^e: |What went wrong|Caused by|Could not|not found" -A2 build.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-3000)
            echo "::error title=Gradle build failed::$msg"
            tail -n 40 build.log
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: TN-Launcher-debug
          path: app/build/outputs/apk/debug/*.apk
